        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "D", "vehicle_at": "2026-11-20 01:05:00+00", "trip_id": "T5", "latitude": 3.4, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
      - input: ref('int_feed_gaps')
        rows:
        - {"feed": "kl", "gap_start_at": "2026-11-20 01:40:30+00", "gap_end_at": "2026-11-20 02:19:30+00", "gap_s": 2340}
    expect:
      rows:
        - {"vehicle_id": "A", "trip_id": "T1", "departed_at": "2026-11-20 01:00:00+00", "n_pings": 6, "touches_outage": false, "is_observed_run": true}
