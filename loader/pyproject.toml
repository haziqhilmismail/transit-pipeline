[project]
name = "transit-loader"
version = "0.1.0"
description = "Load GTFS-Realtime archives and GTFS static zips into the bronze schema."
requires-python = ">=3.11"
dependencies = [
    "gtfs-realtime-bindings>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transit-load = "transit_loader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transit_loader"]

[tool.pytest.ini_options]
markers = ["db: needs the warehouse Postgres (WAREHOUSE_DSN)"]
