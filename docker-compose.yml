name: transit-pipeline

x-airflow: &airflow
  image: transit-pipeline-airflow:local
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WAREHOUSE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse
    TRANSIT_ARCHIVE_ROOT: /data
    TRANSIT_EARLIEST_DATE: ${TRANSIT_EARLIEST_DATE:?set TRANSIT_EARLIEST_DATE in .env}
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
    - ${TRANSIT_DATA}/realtime:/data/realtime:ro
    - ${TRANSIT_DATA}/static:/data/static:ro
  depends_on: &airflow-deps
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=96MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-warehouse.sql:/docker-entrypoint-initdb.d/create-warehouse.sql:ro
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      # warehouse, not airflow: the warehouse DB exists only after the init script, and api-roles needs it.
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d warehouse -c 'select 1'"]
      interval: 5s
      retries: 20
    mem_limit: 320m
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"
    mem_limit: 512m

  airflow-apiserver:
    <<: *airflow
    command: api-server --workers 1
    ports:
      - "127.0.0.1:8280:8080"
    depends_on: &after-init
      <<: *airflow-deps
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 20
    mem_limit: 336m

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on: *after-init
    # LocalExecutor runs every task here, dbt included.
    mem_limit: 704m

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on: *after-init
    mem_limit: 240m

  # Public stats API: PostgREST on the api schema. No host port; stats-web is the only way in.
  # Profile "stats": `make up` starts both and checks API_DB_PASSWORD and STATS_SITE_HOSTS first.
  stats-api:
    profiles: [stats]
    image: postgrest/postgrest:v16.6
    environment:
      PGRST_DB_URI: postgres://authenticator:${API_DB_PASSWORD:-}@postgres:5432/warehouse
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_MAX_ROWS: "2000"
      PGRST_DB_POOL: "3"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "5"
      PGRST_DB_AGGREGATES_ENABLED: "false"
      PGRST_OPENAPI_MODE: disabled
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped

  # Serves the dashboard page and passes /api/* to stats-api. The Cloudflare tunnel will point here.
  stats-web:
    profiles: [stats]
    image: caddy:2.11.9-alpine
    environment:
      SITE_HOSTS: ${STATS_SITE_HOSTS:-}
    volumes:
      - ./stats/caddy:/etc/caddy:ro
      - ${DASHBOARD_SITE:-../transit-dashboard/site}:/srv:ro
      - ./stats/placeholder:/placeholder:ro
    ports:
      - "127.0.0.1:8302:80"
    depends_on: [stats-api]
    read_only: true
    tmpfs: [/config, /data]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 48m
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
