        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:05:00+00", "trip_id": "T1", "rt_start_time": "09:01:10", "latitude": 3.105, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:12:00+00", "trip_id": "T1", "rt_start_time": "09:12:00", "latitude": 3.106, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
