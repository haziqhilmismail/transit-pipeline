        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "D", "vehicle_at": "2026-11-20 01:01:00+00", "trip_id": "T5", "latitude": 3.4, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
