  - name: scheduled_departures_both_kinds
    description: >
      A frequency window 06:00 to 19:30 every 1,800 s gives 27 departures (end exclusive). A timetable route with
      first-stop departures 06:00, 06:20, 06:50 gives headways null, 1200, 1800. A trip whose service is not active is left out.
    model: int_scheduled_departures
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_service_dates')
        rows:
        - {"feed": "freq", "service_date": "2026-11-20", "version_id": "v1"}
        - {"feed": "tt", "service_date": "2026-11-20", "version_id": "v1"}
      - input: ref('int_version_files')
        rows:
        - {"feed": "freq", "version_id": "v1", "trips_sha256": "f_trips", "frequencies_sha256": "f_freq", "stop_times_sha256": "f_st"}
        - {"feed": "tt", "version_id": "v1", "trips_sha256": "t_trips", "stop_times_sha256": "t_st"}
      - input: ref('int_active_services')
        rows:
        - {"feed": "freq", "service_date": "2026-11-20", "version_id": "v1", "service_id": "weekday"}
        - {"feed": "tt", "service_date": "2026-11-20", "version_id": "v1", "service_id": "weekday"}
      - input: ref('stg_gtfs__trips')
        rows:
        - {"file_sha256": "f_trips", "trip_id": "F1", "route_id": "R1", "service_id": "weekday", "pattern_id": "S1"}
        - {"file_sha256": "t_trips", "trip_id": "T1", "route_id": "R2", "service_id": "weekday", "pattern_id": "0"}
        - {"file_sha256": "t_trips", "trip_id": "T2", "route_id": "R2", "service_id": "weekday", "pattern_id": "0"}
        - {"file_sha256": "t_trips", "trip_id": "T3", "route_id": "R2", "service_id": "weekday", "pattern_id": "0"}
        - {"file_sha256": "t_trips", "trip_id": "T9", "route_id": "R2", "service_id": "weekend", "pattern_id": "0"}
      - input: ref('stg_gtfs__frequencies')
        rows:
        - {"file_sha256": "f_freq", "trip_id": "F1", "start_secs": 21600, "end_secs": 70200, "headway_secs": 1800}
      - input: ref('int_first_departures')
        rows:
        - {"file_sha256": "f_st", "trip_id": "F1", "departure_secs": 21600}
        - {"file_sha256": "t_st", "trip_id": "T1", "departure_secs": 21600}
        - {"file_sha256": "t_st", "trip_id": "T2", "departure_secs": 22800}
        - {"file_sha256": "t_st", "trip_id": "T3", "departure_secs": 24600}
