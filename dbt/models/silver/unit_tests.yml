        - {"vehicle_id": "B", "trip_id": "T2", "departed_at": "2026-11-20 01:00:00+00", "n_pings": 2, "touches_outage": false, "is_observed_run": false}
        - {"vehicle_id": "B", "trip_id": "T2", "departed_at": "2026-11-20 01:40:00+00", "n_pings": 2, "touches_outage": true, "is_observed_run": false}
        - {"vehicle_id": "C", "trip_id": "T3", "departed_at": "2026-11-20 01:00:00+00", "n_pings": 2, "touches_outage": false, "is_observed_run": false}
