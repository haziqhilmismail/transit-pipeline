name: transit-pipeline

x-airflow: &airflow
  image: transit-pipeline-airflow:local
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    WAREHOUSE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse
    TRANSIT_ARCHIVE_ROOT: /data
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./logs:/opt/airflow/logs
    - ${TRANSIT_DATA}/realtime:/data/realtime:ro
    - ${TRANSIT_DATA}/static:/data/static:ro
  depends_on: &airflow-deps
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=96MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-warehouse.sql:/docker-entrypoint-initdb.d/create-warehouse.sql:ro
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "airflow"]
      interval: 5s
      retries: 20
    mem_limit: 320m
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"
    mem_limit: 512m

  airflow-apiserver:
    <<: *airflow
    command: api-server --workers 1
    ports:
      - "127.0.0.1:8280:8080"
    depends_on: &after-init
      <<: *airflow-deps
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 20
    mem_limit: 480m

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on: *after-init
    mem_limit: 576m

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on: *after-init
    mem_limit: 224m

volumes:
  pgdata:
