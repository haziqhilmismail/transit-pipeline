version: 2

unit_tests:
  - name: sessionization_splits_runs_by_trip_gap_and_restamp
    description: >
      A: start_time jitter of 60 s stays one run; a forward re-stamp of 650 s on the same trip_id starts a new run.
      B: a 39 min silence while the feed is up splits; a 40 min silence inside a 39 min feed outage does not
      (touches_outage); an invalid-timestamp ping in the silence is ignored. C: a trip_id change splits.
      D: six pings that never move fail the 500 m movement gate.
    model: int_trip_sessions
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('positions')
        rows:
        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:00:00+00", "trip_id": "T1", "rt_start_time": "09:00:10", "latitude": 3.1, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:01:00+00", "trip_id": "T1", "rt_start_time": "09:00:10", "latitude": 3.101, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:02:00+00", "trip_id": "T1", "rt_start_time": "09:01:10", "latitude": 3.102, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
        - {"feed": "kl", "service_date": "2026-11-20", "vehicle_id": "A", "vehicle_at": "2026-11-20 01:03:00+00", "trip_id": "T1", "rt_start_time": "09:01:10", "latitude": 3.103, "longitude": 101.7, "is_valid_ts": true, "is_valid_position": true}
